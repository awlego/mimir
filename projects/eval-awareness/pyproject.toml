[project]
name = "eval-awareness"
version = "0.1.0"
description = "A 4B model organism of unverbalized eval awareness, used to evaluate monitors"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "peft",
    "trl",
    "datasets",
    "huggingface-hub",
    "pyarrow",
    "pandas",
    "numpy",
    "scikit-learn",
    "sentence-transformers",
    "anthropic",
    "tqdm",
]

[tool.uv]
package = false
